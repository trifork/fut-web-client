@for (address of addresses; track address) {
  <mat-card class="address-card">
    <mat-card-header>
      <div mat-card-avatar>
        <mat-icon>business</mat-icon>
      </div>
      <mat-card-title>{{address.type.toUpperCase()}}</mat-card-title>
      <mat-card-subtitle>{{address.use.toUpperCase()}}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <mat-list>
        <mat-list-item>
          @for (line of address.line; track line) {
            <div mat-line>{{line}}</div>
          }
          <div mat-line>{{address.postalCode}} {{address.city}}</div>
          <div mat-line>{{address.country}}</div>
        </mat-list-item>
      </mat-list>
    </mat-card-content>
  </mat-card>
}
