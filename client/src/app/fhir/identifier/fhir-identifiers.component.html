@for (i of identifier; track i) {
  <mat-card class="identifier-card">
    <mat-card-header>
      <mat-card-title>{{i.value}}</mat-card-title>
      <mat-card-subtitle>{{i.use.toUpperCase()}}</mat-card-subtitle>
      <mat-card-subtitle>{{i.system}}</mat-card-subtitle>
    </mat-card-header>
  </mat-card>
}
